<style>
  :root {
    --bg-color: #0b1424; --surface-color: #101c33;
    --primary-color: #ffd400; --text-primary: #eef2f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: 'Noto Sans Tamil', 'Anek Tamil', 'Segoe UI', Arial, sans-serif;
    background: var(--bg-color); color: var(--text-primary);
    display: flex; flex-direction: column; 
    height: 100dvh; 
    overflow: hidden; 
    overscroll-behavior-y: none; 
  }
  
  .app-bar {
    background: var(--surface-color); padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); z-index: 50; position: relative;
  }
  .app-bar h1 { font-size: 14px; margin: 0; color: var(--primary-color); text-transform: uppercase; letter-spacing: 1px;}
  .settings-btn {
    font-size: 18px; cursor: pointer; background: #1e2f4e; padding: 4px 10px; 
    border-radius: 6px; border: 1px solid #263c63;
  }
  .settings-btn:active { transform: scale(0.95); }

  .settings-menu {
    position: absolute; top: 55px; right: 16px; background: #0b1730;
    border: 1px solid #2a5298; border-radius: 10px; padding: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 100;
    display: none; width: 320px; max-height: 80vh; overflow-y: auto;
  }
  .settings-menu h3 { margin: 0 0 8px 0; font-size: 12px; color: #7fb3ff; text-transform: uppercase; border-bottom: 1px solid #1e3f7a; padding-bottom: 4px;}
  .settings-menu .section { margin-bottom: 15px; }

  .styled-select {
    width: 100%; padding: 8px; border-radius: 6px; background: #050a14;
    color: #fff; border: 1px solid #263c63; font-size: 12px; font-weight: bold;
    outline: none; cursor: pointer;
  }
  
  .font-upload-btn {
    background: #1e3f7a; color: #fff; padding: 8px; border-radius: 6px; 
    text-align: center; font-size: 11px; cursor: pointer; display: block; border: 1px dashed #7fb3ff;
  }
  .font-upload-btn input { display: none; }
  .font-status { font-size: 10px; color: #00e676; margin-top: 6px; text-align: center; }

  .preview-area {
    width: 100vw; height: 56.25vw; background: #000;
    flex-shrink: 0; border-bottom: 2px solid #1e2f4e; position: relative;
    touch-action: none; cursor: grab; z-index: 10;
  }
  .preview-area:active { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .controls-area { 
    flex: 1; padding: 12px; z-index: 1; 
    display: flex; flex-direction: column; gap: 10px;
    overflow: hidden; 
    padding-bottom: 95px; 
  }
  
  .compact-card {
    background: var(--surface-color); border: 1px solid #1e2f4e;
    border-radius: 10px; padding: 12px; 
    display: flex; flex-direction: column; gap: 12px;
  }

  .multi-upload-btn {
    display: block; background: #1e3f7a; color: #fff; padding: 8px 12px; 
    border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold;
    cursor: pointer; border: 1px dashed #7fb3ff; margin-bottom: 5px;
  }
  .multi-upload-btn input { display: none; }

  .field-row { display: flex; gap: 8px; align-items: center; }
  .color-col { display: flex; flex-direction: column; gap: 6px; justify-content: space-between; }
  
  .field-row input[type="color"] {
    width: 35px; height: 32px; border: none; border-radius: 6px; cursor: pointer;
    background: #0b1730; padding: 1px; flex-shrink: 0;
  }
  .field-row input[type="text"] {
    flex: 1; background: #0b1730; border: 1px solid #263c63;
    border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13px; font-weight: bold; height: 38px;
    font-family: 'Noto Sans Tamil', 'Anek Tamil', sans-serif;
  }
  .field-row input[type="text"]:focus, .field-row textarea:focus { 
    outline: none; border-color: var(--primary-color); 
  }
  .field-row textarea {
    flex: 1; background: #0b1730; border: 1px solid #263c63;
    border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13px; font-weight: bold;
    height: 60px; resize: none; 
    font-family: 'Noto Sans Tamil', 'Anek Tamil', sans-serif;
    line-height: 1.6;
  }

  .action-btn-row { display: flex; gap: 8px; margin-top: 5px; }
  .action-btn {
    flex: 1; padding: 10px; border-radius: 6px; text-align: center; color: #fff;
    font-size: 12px; font-weight: bold; cursor: pointer; border: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .action-btn:active { transform: scale(0.97); }

  .fab {
    position: fixed; bottom: 15px; left: 12px; right: 12px;
    background: linear-gradient(90deg, #ffd400, #ffea00); color: #000;
    border: none; font-weight: 900; padding: 12px; border-radius: 8px;
    font-size: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    text-transform: uppercase; cursor: pointer; z-index: 20;
  }
  .fab:active { transform: scale(0.98); }
</style>

<button class="fab" id="downloadBtn">Download HD Thumbnail</button>

<script>
const W = 1920, H = 1080;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let activeFontFamily = '"Anek Tamil", "Noto Sans Tamil", sans-serif'; 
let channelLogo = null; 

document.getElementById('settingsBtn').addEventListener('click', () => {
  const menu = document.getElementById('settingsMenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
});

// Changing default colors dynamically based on Layout selection
document.getElementById('layoutSelect').addEventListener('change', (e) => {
  const val = e.target.value;
  if (val === 'news-yellow') {
    document.getElementById('cTop1').value = '#ffffff';
    document.getElementById('cTop2').value = '#000000'; 
    document.getElementById('cBot').value = '#ffffff'; 
  } else if (val === 'news-brand') {
    document.getElementById('cTop1').value = '#ffffff';
    document.getElementById('cTop2').value = '#ffff00'; 
    document.getElementById('cBot').value = '#ffffff';
  }
  autoGenerateThumbnail();
});

// Event Listeners for Redraw
['textStyleSelect', 'gradientSelect', 'tamilFontSelect'].forEach(id => {
  document.getElementById(id).addEventListener('change', autoGenerateThumbnail);
});

['topText', 'bottomText', 'cTop1', 'cTop2', 'cBot'].forEach(id => {
  document.getElementById(id).addEventListener('input', autoGenerateThumbnail);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#settingsMenu') && !e.target.closest('#settingsBtn')) {
    document.getElementById('settingsMenu').style.display = 'none';
  }
});

// Font & Logo Upload Logic
document.getElementById('fontUpload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const arrayBuffer = await file.arrayBuffer();
  try {
    const cleanName = file.name.split('.')[0]; 
    const font = new FontFace(cleanName, arrayBuffer);
    await font.load();
    document.fonts.add(font);
    activeFontFamily = `"${cleanName}"`;
    document.getElementById('fontStatus').innerText = `Current: ${cleanName}`;
    autoGenerateThumbnail();
  } catch (err) {}
});

document.getElementById('logoUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    channelLogo = img;
    document.getElementById('logoStatus').innerText = "Current: Custom Uploaded Logo";
    document.getElementById('settingsMenu').style.display = 'none';
    autoGenerateThumbnail();
  };
  img.src = url;
});

// ==========================================
// UNIVERSAL ROUNDED RECTANGLE FUNCTION
// ==========================================
function drawRoundedRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

// ==========================================
// CRICK NEWS STATIC LOGO GENERATOR 
// ==========================================
let cachedCrickLogo = null;
function getCrickNewsLogoCanvas(width) {
    if (cachedCrickLogo && cachedCrickLogo.width === width) return cachedCrickLogo;
    
    let height = width * 0.75; 
    let offCanvas = document.createElement('canvas');
    offCanvas.width = width; offCanvas.height = height;
    let lctx = offCanvas.getContext('2d');
    
    const Sw = width; const Sh = height; const cqi = v => (v / 100) * Sw;

    lctx.save();
    const r = cqi(3); drawRoundedRect(lctx, 0, 0, Sw, Sh, r); lctx.clip();
    
    let cardGrad = lctx.createRadialGradient(Sw*0.32, Sh*0.22, 0, Sw*0.5, Sh*0.5, Math.max(Sw,Sh)*0.8);
    cardGrad.addColorStop(0, '#234a82'); cardGrad.addColorStop(0.38, '#14294f');
    cardGrad.addColorStop(0.68, '#081326'); cardGrad.addColorStop(1, '#010204');
    lctx.fillStyle = cardGrad; lctx.fillRect(0, 0, Sw, Sh);
    
    let emberGrad = lctx.createRadialGradient(Sw*0.3, Sh*0.82, 0, Sw*0.3, Sh*0.82, Math.max(Sw,Sh)*0.6);
    emberGrad.addColorStop(0, 'rgba(170,20,20,0.38)'); emberGrad.addColorStop(1, 'rgba(170,20,20,0)');
    lctx.fillStyle = emberGrad; lctx.fillRect(0, 0, Sw, Sh);
    
    let sheenGrad = lctx.createLinearGradient(0, 0, 0, Sh*0.4);
    sheenGrad.addColorStop(0, 'rgba(255,255,255,0.16)'); sheenGrad.addColorStop(0.55, 'rgba(255,255,255,0.04)'); sheenGrad.addColorStop(1, 'rgba(255,255,255,0)');
    lctx.fillStyle = sheenGrad; lctx.fillRect(0, 0, Sw, Sh*0.4);
    
    for(let sl=0; sl<Sh; sl+=Math.max(2, cqi(3.6))){
        lctx.fillStyle = 'rgba(255,255,255,0.012)'; lctx.fillRect(0, sl, Sw, Math.max(1, cqi(1.8)));
    }
    
    let topGold = lctx.createLinearGradient(0, 0, Sw, 0);
    topGold.addColorStop(0, 'transparent'); topGold.addColorStop(0.2, '#d9ac2e');
    topGold.addColorStop(0.5, '#ffe27a'); topGold.addColorStop(0.8, '#d9ac2e'); topGold.addColorStop(1, 'transparent');
    lctx.fillStyle = topGold; lctx.fillRect(0, 0, Sw, Math.max(1, cqi(1.1)));
    
    lctx.save(); drawRoundedRect(lctx, 0, 0, Sw, Sh, r); 
    lctx.lineWidth = Math.max(1, cqi(0.5));
    let borderGrad = lctx.createLinearGradient(0, 0, Sw, Sh);
    borderGrad.addColorStop(0, 'rgba(255,215,120,0.85)'); borderGrad.addColorStop(0.5, 'rgba(240,196,51,0.5)'); borderGrad.addColorStop(1, 'rgba(195,158,55,0.3)');
    lctx.strokeStyle = borderGrad; lctx.stroke(); lctx.restore();

    const newsFS = cqi(16.5); lctx.font = `900 ${newsFS}px Arial, sans-serif`;
    const newsLetters = ['N','E','W','S'];
    const newsSpacing = cqi(3.2), newsPadX = cqi(4.2), newsPadY = cqi(1.3);
    let newsLettersW = 0; newsLetters.forEach(ch => { newsLettersW += lctx.measureText(ch).width; });
    const newsW = newsLettersW + newsSpacing*3 + newsPadX*2, newsH = newsFS + newsPadY*2;
    const newsX = Sw/2 - newsW/2, newsY = cqi(8);
    
    let newsGrad = lctx.createLinearGradient(0, newsY, 0, newsY+newsH);
    newsGrad.addColorStop(0, '#d10000'); newsGrad.addColorStop(0.6, '#8b0000'); newsGrad.addColorStop(1, '#5c0000');
    lctx.fillStyle = newsGrad; lctx.fillRect(newsX, newsY, newsW, newsH);
    lctx.fillStyle = 'rgba(255,210,0,0.55)'; lctx.fillRect(newsX, newsY, newsW, Math.max(1, cqi(0.3)));
    
    lctx.fillStyle = '#fff'; lctx.textAlign = 'left'; lctx.textBaseline = 'middle';
    lctx.shadowColor = 'rgba(0,0,0,0.8)'; lctx.shadowBlur = cqi(0.6);
    let nLx = newsX + newsPadX;
    newsLetters.forEach(ch => { lctx.fillText(ch, nLx, newsY + newsH/2 + newsFS*0.05); nLx += lctx.measureText(ch).width + newsSpacing; });
    lctx.shadowBlur = 0;

    const letterFS = cqi(38); lctx.font = `900 ${letterFS}px Impact, Arial, sans-serif`;
    lctx.textAlign = 'left'; lctx.textBaseline = 'alphabetic';
    const midY = cqi(60);
    
    let lg = lctx.createLinearGradient(0, midY-letterFS, 0, midY);
    lg.addColorStop(0, '#fff8e1'); lg.addColorStop(0.18, '#f5d060'); lg.addColorStop(0.35, '#c8991a'); lg.addColorStop(0.5, '#f0c433'); 
    lg.addColorStop(0.65, '#a87720'); lg.addColorStop(0.8, '#f5d060'); lg.addColorStop(1, '#fff8e1');
    
    const gapW = cqi(13), spacing = cqi(1);
    const w1 = lctx.measureText('C').width, w2 = lctx.measureText('R').width, w3 = lctx.measureText('C').width, w4 = lctx.measureText('K').width;
    const totalW = w1 + spacing + w2 + spacing + gapW + spacing + w3 + spacing + w4;
    const titleMaxW = Sw * 0.94; const titleFit = totalW > titleMaxW ? Math.max(0.4, titleMaxW/totalW) : 1;
    
    lctx.save(); lctx.translate(Sw/2, 0); lctx.scale(titleFit, 1); lctx.translate(-Sw/2, 0);
    let cx = Sw/2 - totalW/2;
    
    lctx.lineJoin = 'round'; lctx.miterLimit = 2; lctx.strokeStyle = 'rgba(20,10,0,0.9)'; lctx.lineWidth = Math.max(1, cqi(0.55));
    lctx.strokeText('C', cx, midY); lctx.strokeText('R', cx + w1 + spacing, midY); lctx.strokeText('C', cx + w1 + spacing + w2 + spacing + gapW + spacing, midY); lctx.strokeText('K', cx + w1 + spacing + w2 + spacing + gapW + spacing + w3 + spacing, midY);
    
    lctx.fillStyle = lg; lctx.shadowColor = 'rgba(0,0,0,0.95)'; lctx.shadowBlur = cqi(3.4); lctx.shadowOffsetX = -cqi(1.3); lctx.shadowOffsetY = cqi(2.6);
    lctx.fillText('C', cx, midY); cx += w1 + spacing; lctx.fillText('R', cx, midY); cx += w2 + spacing;
    const gCenterX = cx + gapW/2; cx += gapW + spacing; lctx.fillText('C', cx, midY); cx += w3 + spacing; lctx.fillText('K', cx, midY);
    lctx.shadowBlur = 0; lctx.shadowOffsetX = 0; lctx.shadowOffsetY = 0;

    const groundY = midY; const stumpFullH = letterFS * 0.5; const stumpsTopY = groundY - stumpFullH;
    const stumpW = cqi(1.6*0.9), stumpGapPx = cqi(1.2*0.9);

    lctx.save(); lctx.translate(gCenterX, groundY);
    for(let i=-1; i<=1; i++){
        const sx = i*(stumpW+stumpGapPx) - stumpW/2;
        let stumpGrad = lctx.createLinearGradient(sx, 0, sx+stumpW, 0);
        stumpGrad.addColorStop(0, '#c8b87a'); stumpGrad.addColorStop(0.25, '#f5edc0'); stumpGrad.addColorStop(0.5, '#a08840'); stumpGrad.addColorStop(0.75, '#f5edc0'); stumpGrad.addColorStop(1, '#a08840');
        lctx.fillStyle = stumpGrad; lctx.fillRect(sx, -stumpFullH, stumpW, stumpFullH);
        lctx.fillStyle = i===0 ? '#1a0000' : '#001a00'; lctx.fillRect(sx+stumpW*0.25, -stumpFullH*0.86, stumpW*0.5, stumpFullH*0.5);
    }
    lctx.restore();

    const bailW = cqi(3.4), bailH = cqi(0.8);
    [-1, 1].forEach(side => {
        const nomX = gCenterX + side*(bailW/2 + cqi(0.1)); const nomY = stumpsTopY;
        lctx.save(); lctx.translate(nomX, nomY); lctx.fillStyle = '#555'; drawRoundedRect(lctx, -bailW/2, -bailH/2, bailW, bailH, bailH/2); lctx.fill(); lctx.restore();
    });

    const ballW = cqi(7.5); const ballCenterX = gCenterX; const ballCenterY = stumpsTopY - ballW/2 - cqi(1); const ballR = ballW/2;
    lctx.save(); let ballGrad = lctx.createRadialGradient(ballCenterX - ballR*0.3, ballCenterY - ballR*0.3, 0, ballCenterX, ballCenterY, ballR);
    ballGrad.addColorStop(0, '#ff6060'); ballGrad.addColorStop(0.4, '#cc0000'); ballGrad.addColorStop(0.75, '#800000'); ballGrad.addColorStop(1, '#3a0000');
    lctx.beginPath(); lctx.fillStyle = ballGrad; lctx.arc(ballCenterX, ballCenterY, ballR, 0, Math.PI*2); lctx.fill();
    
    lctx.beginPath(); lctx.arc(ballCenterX - ballR*0.3, ballCenterY - ballR*0.3, ballR*0.25, 0, Math.PI*2);
    let shineGrad = lctx.createRadialGradient(ballCenterX - ballR*0.3, ballCenterY - ballR*0.3, 0, ballCenterX - ballR*0.3, ballCenterY - ballR*0.3, ballR*0.25);
    shineGrad.addColorStop(0, 'rgba(255,200,200,0.55)'); shineGrad.addColorStop(1, 'rgba(255,100,100,0)');
    lctx.fillStyle = shineGrad; lctx.fill();
    
    lctx.beginPath(); lctx.arc(ballCenterX, ballCenterY, ballR, 0, Math.PI*2); lctx.clip();
    lctx.strokeStyle = 'rgba(255,255,255,0.75)'; lctx.lineWidth = Math.max(0.6, ballR*0.1);
    lctx.beginPath(); lctx.moveTo(ballCenterX, ballCenterY - ballR); lctx.lineTo(ballCenterX, ballCenterY + ballR); lctx.stroke(); lctx.restore();

    lctx.restore(); 
    cachedCrickLogo = offCanvas;
    return offCanvas;
}

// ==========================================
// GRID UPLOAD & IMAGE HANDLING
// ==========================================
const imgState = [ { img: null, ox: 0, oy: 0 }, { img: null, ox: 0, oy: 0 }, { img: null, ox: 0, oy: 0 } ];

document.getElementById('multiImageUpload').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files).slice(0, 3); 
  if (files.length === 0) return;
  imgState.forEach(s => { s.img = null; s.ox = 0; s.oy = 0; });

  const loadImg = (file, index) => {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { imgState[index].img = image; resolve(); };
      image.src = url;
    });
  };
  await Promise.all(files.map((f, i) => loadImg(f, i)));
  autoGenerateThumbnail();
});

// ==========================================
// ADVANCED OVERLAY SYSTEM (Crop, Pinch, Zoom)
// ==========================================
const overlays = []; 
let activeOverlayIdx = -1; 
let draggingOverlayAction = null; 
let draggingBgIdx = -1;
let dragStartX = 0, dragStartY = 0;
let ovInitState = null;

const activePointers = new Map();
let initialPinchDist = 0;
let pinchStartScale = 1;

function loadOverlayToCanvas(url, staggerIndex, sourceFile) {
  staggerIndex = staggerIndex || 0;
  const img = new Image();
  img.onload = () => {
    let maxH = 950; 
    let scale = Math.min(1, maxH / img.height);
    overlays.push({ 
      img: img, 
      cx: W - (img.width*scale)/2 - 50, 
      cy: H - (img.height*scale)/2, 
      scale: scale,
      cropX: 0, cropY: 0, 
      cropW: img.width, cropH: img.height,
      flipX: false, rotation: 0, 
      sourceFile: sourceFile || null 
    });
    activeOverlayIdx = overlays.length - 1; 
    autoGenerateThumbnail();
  };
  img.src = url;
}

document.getElementById('addImageUpload').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    loadOverlayToCanvas(url, idx, file);
  });
  e.target.value = ''; 
});

async function runCutout(file, targetOverlayIdx) {
  const btn = document.getElementById('cutoutBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Processing...';
  btn.style.pointerEvents = 'none';

  const applyResult = (url) => {
    const img = new Image();
    img.onload = () => {
      if (targetOverlayIdx !== null && overlays[targetOverlayIdx]) {
        overlays[targetOverlayIdx].img = img;
        activeOverlayIdx = targetOverlayIdx;
        autoGenerateThumbnail();
      } else {
        loadOverlayToCanvas(url, 0, file);
      }
    };
    img.src = url;
  };

  try {
    if (!window.SelfieSegmentation) throw new Error('Lib missing');
    if (!window.mpSelfieSegmentation) {
      window.mpSelfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });
      window.mpSelfieSegmentation.setOptions({ modelSelection: 0 });
    }

    const objectUrl = URL.createObjectURL(file);
    const imgElement = new Image();
    imgElement.crossOrigin = "anonymous";
    await new Promise((resolve) => { imgElement.onload = resolve; imgElement.src = objectUrl; });

    const maskPromise = new Promise((resolve) => {
      window.mpSelfieSegmentation.onResults((results) => {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = imgElement.naturalWidth || imgElement.width;
        outCanvas.height = imgElement.naturalHeight || imgElement.height;
        const outCtx = outCanvas.getContext('2d');
        outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
        outCtx.drawImage(results.segmentationMask, 0, 0, outCanvas.width, outCanvas.height);
        outCtx.globalCompositeOperation = 'source-in';
        outCtx.drawImage(results.image, 0, 0, outCanvas.width, outCanvas.height);
        resolve(outCanvas.toDataURL('image/png'));
      });
    });

    await window.mpSelfieSegmentation.send({ image: imgElement });
    const finalUrl = await maskPromise;
    applyResult(finalUrl);
  } catch(err) {
    applyResult(URL.createObjectURL(file));
    alert("Background Remove failed. Adding normal image.");
  } finally {
    btn.innerHTML = originalText;
    btn.style.pointerEvents = 'auto';
  }
}

document.getElementById('cutoutBtn').addEventListener('click', () => {
  const activeOv = overlays[activeOverlayIdx];
  if (activeOv && activeOv.sourceFile) {
    runCutout(activeOv.sourceFile, activeOverlayIdx);
  } else if (activeOv && !activeOv.sourceFile) {
    alert('Select an image in preview to remove background.');
  } else {
    document.getElementById('overlayImageUpload').click();
  }
});
document.getElementById('overlayImageUpload').addEventListener('change', (e) => {
  if (e.target.files[0]) runCutout(e.target.files[0], null);
  e.target.value = ''; 
});

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = getCanvasPos(e);
  activePointers.set(e.pointerId, pos);

  if (activePointers.size === 2 && activeOverlayIdx !== -1) {
     const pts = Array.from(activePointers.values());
     initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
     pinchStartScale = overlays[activeOverlayIdx].scale;
     draggingOverlayAction = 'pinch';
     return; 
  }

  dragStartX = pos.x; dragStartY = pos.y;
  
  if (activeOverlayIdx !== -1) {
    const ov = overlays[activeOverlayIdx];
    const w = ov.cropW * ov.scale; const h = ov.cropH * ov.scale;
    const dx = pos.x - ov.cx; const dy = pos.y - ov.cy;
    const rot = -(ov.rotation || 0);
    const lx = dx * Math.cos(rot) - dy * Math.sin(rot);
    const ly = dx * Math.sin(rot) + dy * Math.cos(rot);

    let hit = null;
    if (Math.hypot(lx - 0, ly - (-h/2 - 60)) <= 40) hit = 'rotate';
    else if (Math.hypot(lx - (w/2 + 20), ly - (-h/2 - 20)) <= 40) hit = 'delete';
    else if (Math.hypot(lx - (-w/2 - 20), ly - (-h/2 - 20)) <= 40) hit = 'flip';
    else if (Math.hypot(lx - (w/2 + 20), ly - (h/2 + 20)) <= 40) hit = 'resize';
    else if (Math.abs(lx - (-w/2)) <= 25 && Math.abs(ly) <= h/2) hit = 'cropL';
    else if (Math.abs(lx - (w/2)) <= 25 && Math.abs(ly) <= h/2) hit = 'cropR';
    else if (Math.abs(ly - (-h/2)) <= 25 && Math.abs(lx) <= w/2) hit = 'cropT';
    else if (Math.abs(ly - (h/2)) <= 25 && Math.abs(lx) <= w/2) hit = 'cropB';
    else if (Math.abs(lx) <= w/2 && Math.abs(ly) <= h/2) hit = 'move';

    if (hit) {
        if (hit === 'delete') { overlays.splice(activeOverlayIdx, 1); activeOverlayIdx = -1; autoGenerateThumbnail(); return; }
        if (hit === 'flip') { ov.flipX = !ov.flipX; autoGenerateThumbnail(); return; }
        draggingOverlayAction = hit;
        ovInitState = Object.assign({}, ov);
        return;
    }
  }

  for(let i = overlays.length - 1; i >= 0; i--) {
    const ov = overlays[i];
    const w = ov.cropW * ov.scale; const h = ov.cropH * ov.scale;
    const dx = pos.x - ov.cx; const dy = pos.y - ov.cy;
    const rot = -(ov.rotation || 0);
    const lx = dx * Math.cos(rot) - dy * Math.sin(rot);
    const ly = dx * Math.sin(rot) + dy * Math.cos(rot);
    if (Math.abs(lx) <= w/2 && Math.abs(ly) <= h/2) {
      activeOverlayIdx = i; draggingOverlayAction = 'move'; 
      ovInitState = Object.assign({}, ov); autoGenerateThumbnail(); return;
    }
  }
  
  activeOverlayIdx = -1; autoGenerateThumbnail();

  const layout = document.getElementById('layoutSelect').value;
  const count = imgState.filter(s => s.img).length;
  if (layout === 'news-brand') {
    if (pos.y > 330 && pos.y < 860) { 
      if (count >= 1 && pos.x < 640) draggingBgIdx = 0;
      else if (count >= 2 && pos.x > 640 && pos.x < 1280) draggingBgIdx = 1;
      else if (count >= 3 && pos.x > 1280) draggingBgIdx = 2;
    }
  } else if (layout === 'news-yellow') {
    if (pos.y > 420 && pos.y < 900) { 
      if (count >= 1 && pos.x < 640) draggingBgIdx = 0;
      else if (count >= 2 && pos.x > 640 && pos.x < 1280) draggingBgIdx = 1;
      else if (count >= 3 && pos.x > 1280) draggingBgIdx = 2;
    }
  } else {
    if (pos.y > 200 && pos.y < 950) {
      if (count === 1) draggingBgIdx = 0;
      else if (count === 2) draggingBgIdx = (pos.x < W / 2) ? 0 : 1;
      else if (count >= 3) {
        if (pos.x < 640) draggingBgIdx = 0;
        else if (pos.x < 1280) draggingBgIdx = 1;
        else draggingBgIdx = 2;
      }
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  const pos = getCanvasPos(e);
  activePointers.set(e.pointerId, pos);

  if (activePointers.size === 2 && draggingOverlayAction === 'pinch' && activeOverlayIdx !== -1) {
     e.preventDefault();
     const pts = Array.from(activePointers.values());
     const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
     overlays[activeOverlayIdx].scale = pinchStartScale * (dist / initialPinchDist);
     autoGenerateThumbnail();
     return;
  }

  if (draggingOverlayAction && activeOverlayIdx !== -1 && draggingOverlayAction !== 'pinch') {
      e.preventDefault();
      const ov = overlays[activeOverlayIdx];
      const deltaX = pos.x - dragStartX;
      const deltaY = pos.y - dragStartY;
      
      if (draggingOverlayAction === 'move') {
          ov.cx = ovInitState.cx + deltaX; ov.cy = ovInitState.cy + deltaY;
      } else if (draggingOverlayAction === 'rotate') {
          ov.rotation = Math.atan2(pos.y - ovInitState.cy, pos.x - ovInitState.cx) + Math.PI/2;
      } else if (draggingOverlayAction === 'resize') {
          const initDist = Math.hypot(dragStartX - ovInitState.cx, dragStartY - ovInitState.cy);
          const curDist = Math.hypot(pos.x - ovInitState.cx, pos.y - ovInitState.cy);
          ov.scale = ovInitState.scale * (curDist / initDist);
      } else if (ovInitState.scale > 0) {
          const ldx = deltaX * Math.cos(-ovInitState.rotation) - deltaY * Math.sin(-ovInitState.rotation);
          const ldy = deltaX * Math.sin(-ovInitState.rotation) + deltaY * Math.cos(-ovInitState.rotation);

          if (draggingOverlayAction === 'cropR') {
              let visualChange = 0;
              if (!ovInitState.flipX) {
                  let newCropW = ovInitState.cropW + ldx / ovInitState.scale;
                  if (newCropW < 10) newCropW = 10;
                  if (ovInitState.cropX + newCropW > ovInitState.img.width) newCropW = ovInitState.img.width - ovInitState.cropX;
                  ov.cropW = newCropW;
                  visualChange = (ov.cropW - ovInitState.cropW) * ovInitState.scale;
              } else {
                  let cropChange = -ldx / ovInitState.scale;
                  let newCropX = ovInitState.cropX + cropChange; let newCropW = ovInitState.cropW - cropChange;
                  if (newCropW < 10) { newCropX = ovInitState.cropX + ovInitState.cropW - 10; newCropW = 10; }
                  if (newCropX < 0) { newCropW = ovInitState.cropW + ovInitState.cropX; newCropX = 0; }
                  ov.cropX = newCropX; ov.cropW = newCropW;
                  visualChange = (ovInitState.cropW - ov.cropW) * ovInitState.scale;
              }
              let shiftLx = visualChange / 2;
              ov.cx = ovInitState.cx + shiftLx * Math.cos(ovInitState.rotation);
              ov.cy = ovInitState.cy + shiftLx * Math.sin(ovInitState.rotation);
          } 
          else if (draggingOverlayAction === 'cropL') {
              let visualChange = 0;
              if (!ovInitState.flipX) {
                  let cropChange = ldx / ovInitState.scale;
                  let newCropX = ovInitState.cropX + cropChange; let newCropW = ovInitState.cropW - cropChange;
                  if (newCropW < 10) { newCropX = ovInitState.cropX + ovInitState.cropW - 10; newCropW = 10; }
                  if (newCropX < 0) { newCropW = ovInitState.cropW + ovInitState.cropX; newCropX = 0; }
                  ov.cropX = newCropX; ov.cropW = newCropW;
                  visualChange = (ovInitState.cropW - ov.cropW) * ovInitState.scale;
              } else {
                  let newCropW = ovInitState.cropW - ldx / ovInitState.scale;
                  if (newCropW < 10) newCropW = 10;
                  if (ovInitState.cropX + newCropW > ovInitState.img.width) newCropW = ovInitState.img.width - ovInitState.cropX;
                  ov.cropW = newCropW;
                  visualChange = (ov.cropW - ovInitState.cropW) * ovInitState.scale;
              }
              let shiftLx = -visualChange / 2;
              ov.cx = ovInitState.cx + shiftLx * Math.cos(ovInitState.rotation);
              ov.cy = ovInitState.cy + shiftLx * Math.sin(ovInitState.rotation);
          }
          else if (draggingOverlayAction === 'cropB') {
              let newCropH = ovInitState.cropH + ldy / ovInitState.scale;
              if (newCropH < 10) newCropH = 10;
              if (ovInitState.cropY + newCropH > ovInitState.img.height) newCropH = ovInitState.img.height - ovInitState.cropY;
              ov.cropH = newCropH;
              let visualChangeY = (ov.cropH - ovInitState.cropH) * ovInitState.scale;
              let shiftLy = visualChangeY / 2;
              ov.cx = ovInitState.cx - shiftLy * Math.sin(ovInitState.rotation);
              ov.cy = ovInitState.cy + shiftLy * Math.cos(ovInitState.rotation);
          }
          else if (draggingOverlayAction === 'cropT') {
              let cropChangeY = ldy / ovInitState.scale;
              let newCropY = ovInitState.cropY + cropChangeY; let newCropH = ovInitState.cropH - cropChangeY;
              if (newCropH < 10) { newCropY = ovInitState.cropY + ovInitState.cropH - 10; newCropH = 10; }
              if (newCropY < 0) { newCropH = ovInitState.cropH + ovInitState.cropY; newCropY = 0; }
              ov.cropY = newCropY; ov.cropH = newCropH;
              let visualChangeY2 = (ovInitState.cropH - ov.cropH) * ovInitState.scale;
              let shiftLy2 = -visualChangeY2 / 2;
              ov.cx = ovInitState.cx - shiftLy2 * Math.sin(ovInitState.rotation);
              ov.cy = ovInitState.cy + shiftLy2 * Math.cos(ovInitState.rotation);
          }
      }
      autoGenerateThumbnail();
      return;
  }

  if (draggingBgIdx !== -1) {
      e.preventDefault(); 
      imgState[draggingBgIdx].ox += pos.x - dragStartX; 
      imgState[draggingBgIdx].oy += pos.y - dragStartY;
      dragStartX = pos.x; dragStartY = pos.y; 
      requestAnimationFrame(autoGenerateThumbnail);
  }
});

function handlePointerEnd(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) { draggingOverlayAction = null; draggingBgIdx = -1; } 
  else if (activePointers.size === 1) { if (draggingOverlayAction === 'pinch') draggingOverlayAction = null; }
}
window.addEventListener('pointerup', handlePointerEnd);
window.addEventListener('pointercancel', handlePointerEnd);
window.addEventListener('pointerout', (e) => { if (!e.relatedTarget || e.relatedTarget.nodeName === 'HTML') handlePointerEnd(e); });

// ==========================================
// RENDER HELPERS
// ==========================================
function shadeColor(color, percent) {
  let R = parseInt(color.substring(1,3),16); let G = parseInt(color.substring(3,5),16); let B = parseInt(color.substring(5,7),16);
  R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
  R = (R<255)?R:255; R = Math.max(0, R); G = (G<255)?G:255; G = Math.max(0, G); B = (B<255)?B:255; B = Math.max(0, B);
  let RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
  let GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
  let BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
  return "#"+RR+GG+BB;
}

// ----------------------------------------------------
// Flawless Measurement Logic for Highlighted Text
// ----------------------------------------------------
function getAutoFillFontSize(text, targetW, maxFS) {
  if (!text || !text.trim()) return maxFS;
  
  const segments = text.split('*');
  if (segments.length === 1) {
      ctx.font = `900 100px ${activeFontFamily}`;
      let w = ctx.measureText(text).width;
      if(w === 0) return maxFS;
      return Math.floor(Math.min((targetW / w) * 100, maxFS));
  }

  let totalW = 0;
  ctx.font = `900 100px ${activeFontFamily}`;
  const boxPaddingX = 20; // Slightly increased padding inside red box
  const marginX = 15;     // Gap between normal and highlighted word

  for (let i = 0; i < segments.length; i++) {
      let txt = segments[i];
      let isHi = (i % 2 !== 0 && txt.trim() !== '');
      if (isHi) txt = txt.trim(); // Trim highlight words to keep box tight

      let w = ctx.measureText(txt).width;
      if (w === 0 && txt === '') continue; 

      let boxW = isHi ? (w + boxPaddingX * 2) : w;
      
      // Add safe margin if we are connecting two valid segments
      let extraMargin = 0;
      if (totalW > 0) extraMargin = marginX; 

      totalW += boxW + extraMargin;
  }
  
  if(totalW === 0) return maxFS;
  let size = (targetW / totalW) * 100;
  return Math.floor(Math.min(size, maxFS));
}

// ----------------------------------------------------
// Perfectly Spaced 3D Render Logic for Rich Text
// ----------------------------------------------------
function draw3DText(text, x, y, fontSize, userColor, forcePlain) {
  if (!text || !text.trim()) return;
  
  const segments = text.split('*');
  
  // Standard render if no asterisk found
  if (segments.length === 1) {
      ctx.font = `900 ${fontSize}px ${activeFontFamily}`;
      ctx.lineJoin = 'round'; ctx.miterLimit = 2;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      renderSpecificTextStyle(text, x, y, fontSize, userColor, forcePlain);
      return;
  }

  // Pre-calculate segments for precise box placement
  ctx.font = `900 ${fontSize}px ${activeFontFamily}`;
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; // Strictly Left Align for segment sequence

  let hiTextColor = '#ffff00'; let hiBgColor = '#cc0000'; 
  let uC = userColor.toLowerCase();
  
  // Dynamic Contrast Matching
  if (uC === '#ffffff' || uC === '#fff') { hiTextColor = '#ffff00'; hiBgColor = '#d30000'; } 
  else if (uC === '#ffff00' || uC === '#fce300') { hiTextColor = '#ffffff'; hiBgColor = '#d30000'; } 
  else if (uC === '#000000' || uC === '#000') { hiTextColor = '#ffffff'; hiBgColor = '#d30000'; } 
  else { hiTextColor = '#ffffff'; hiBgColor = '#000000'; }

  let segData = [];
  let totalW = 0;
  const boxPaddingX = fontSize * 0.20; // Padding inside red box
  const marginX = fontSize * 0.15;     // Safe Margin to prevent outline overlaps

  for (let i = 0; i < segments.length; i++) {
      let txt = segments[i];
      let isHi = (i % 2 !== 0 && txt.trim() !== '');
      if (isHi) txt = txt.trim(); 

      let w = ctx.measureText(txt).width;
      if (w === 0 && txt === '') continue; 

      let boxW = isHi ? (w + boxPaddingX * 2) : w;
      let extraMargin = (segData.length > 0) ? marginX : 0; 

      totalW += boxW + extraMargin;
      segData.push({ text: txt, isHi: isHi, boxW: boxW, margin: extraMargin });
  }

  // 1. Calculate X starts for each block
  let currentX = x - (totalW / 2);
  for (let i = 0; i < segData.length; i++) {
      currentX += segData[i].margin;
      segData[i].startX = currentX;
      currentX += segData[i].boxW;
  }

  // 2. Draw Background Boxes FIRST (so they stay behind text strokes)
  for (let i = 0; i < segData.length; i++) {
      let sd = segData[i];
      if (sd.isHi) {
          ctx.fillStyle = hiBgColor;
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = Math.max(10, fontSize * 0.1); 
          ctx.shadowOffsetY = Math.max(5, fontSize * 0.05);
          
          // Adjusted to perfectly fit Tamil ascenders (shifted UP and increased overall height)
          let boxY = y - fontSize * 0.75; 
          let boxH = fontSize * 1.35;
          drawRoundedRect(ctx, sd.startX, boxY, sd.boxW, boxH, fontSize * 0.15);
          ctx.fill();
          
          ctx.shadowColor = 'transparent';
      }
  }

  // 3. Draw the Text Strokes and Fills OVER the boxes
  for (let i = 0; i < segData.length; i++) {
      let sd = segData[i];
      let drawX = sd.isHi ? sd.startX + boxPaddingX : sd.startX;
      let tColor = sd.isHi ? hiTextColor : userColor;
      
      renderSpecificTextStyle(sd.text, drawX, y, fontSize, tColor, forcePlain);
  }
}

// ----------------------------------------------------
// Isolated Style Drawer Logic (for cleaner code)
// ----------------------------------------------------
function renderSpecificTextStyle(renderTxt, x, y, fontSize, tColor, forcePlain) {
  const styleId = document.getElementById('textStyleSelect').value;
  
  if (forcePlain) {
      ctx.fillStyle = tColor || '#ffffff';
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.fillText(renderTxt, x, y);
      return;
  }

  if (styleId === "flat-crisp") {
      ctx.lineWidth = Math.max(10, fontSize * 0.12); 
      if (tColor === '#000000' || tColor === '#000' || tColor.toLowerCase() === '#000000') {
        ctx.strokeStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,0.5)';
      } else {
        ctx.strokeStyle = '#000000'; ctx.shadowColor = 'rgba(0,0,0,1)';
      }
      ctx.strokeText(renderTxt, x, y);
      ctx.shadowBlur = 15; ctx.shadowOffsetY = 10;
      ctx.fillStyle = tColor; ctx.fillText(renderTxt, x, y);
      ctx.shadowColor = 'transparent';
  } else if (styleId === "image-perfect") {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,1)'; ctx.shadowBlur = 18; ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 10;
      ctx.lineWidth = Math.max(16, fontSize * 0.22); ctx.strokeStyle = '#000000'; ctx.strokeText(renderTxt, x, y); ctx.restore();
      ctx.lineWidth = Math.max(16, fontSize * 0.22); ctx.strokeStyle = '#000000'; ctx.strokeText(renderTxt, x, y + 4);
      ctx.lineWidth = Math.max(4, fontSize * 0.05); ctx.strokeStyle = '#ffffff'; ctx.strokeText(renderTxt, x, y);
      const grad = ctx.createLinearGradient(0, y - fontSize*0.375, 0, y + fontSize*0.375);
      grad.addColorStop(0, shadeColor(tColor, 35)); grad.addColorStop(0.5, tColor); grad.addColorStop(1, shadeColor(tColor, -25));
      ctx.fillStyle = grad; ctx.fillText(renderTxt, x, y);
  } else if (styleId === "11") {
      const depth = Math.max(4, Math.floor(fontSize * 0.06)); 
      const thick = Math.max(6, Math.floor(fontSize * 0.08));
      const darkColor = shadeColor(tColor, -40); const darkestColor = shadeColor(tColor, -70); 
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,1)'; ctx.shadowBlur = 15; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 8;
      ctx.lineWidth = thick; ctx.strokeStyle = darkestColor; ctx.strokeText(renderTxt, x + depth, y + depth); ctx.restore();
      for (let i = depth; i >= 1; i--) { 
        ctx.lineWidth = thick; ctx.strokeStyle = darkColor; ctx.strokeText(renderTxt, x + i, y + i); ctx.fillStyle = darkColor; ctx.fillText(renderTxt, x + i, y + i); 
      }
      ctx.lineWidth = Math.max(3, fontSize * 0.04); ctx.strokeStyle = '#ffffff'; ctx.strokeText(renderTxt, x, y); 
      ctx.lineWidth = Math.max(2, fontSize * 0.02); ctx.strokeStyle = tColor; ctx.strokeText(renderTxt, x, y); ctx.fillStyle = tColor; ctx.fillText(renderTxt, x, y);
  }
}

function drawGridImage(state, x, y, w, h) {
  if (!state.img) return;
  ctx.save();
  drawRoundedRect(ctx, x, y, w, h, 25); ctx.clip();
  const scale = Math.max(w / state.img.width, h / state.img.height);
  const dw = state.img.width * scale; const dh = state.img.height * scale;
  const dx = ((w - dw) / 2) + x + state.ox; const dy = ((h - dh) / 2) + y + state.oy;
  ctx.filter = 'contrast(1.15) saturate(1.15)';
  ctx.drawImage(state.img, dx, dy, dw, dh);
  ctx.restore();
  ctx.lineWidth = 14; ctx.strokeStyle = '#ffffff'; drawRoundedRect(ctx, x, y, w, h, 25); ctx.stroke();
}

function drawSeamlessImageStandard(state, x, y, w, h, fadeLeft) {
  if (!state.img) return;
  const offCanvas = document.createElement('canvas');
  offCanvas.width = w; offCanvas.height = h;
  const offCtx = offCanvas.getContext('2d');
  const scale = Math.max(w / state.img.width, h / state.img.height);
  const dw = state.img.width * scale; const dh = state.img.height * scale;
  const dx = ((w - dw) / 2) + state.ox; const dy = ((h - dh) / 2) + state.oy;
  offCtx.filter = 'contrast(1.15) saturate(1.25) brightness(1.05)';
  offCtx.drawImage(state.img, dx, dy, dw, dh);
  if (fadeLeft) {
    offCtx.globalCompositeOperation = 'destination-in';
    const grad = offCtx.createLinearGradient(0, 0, 240, 0); 
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,1)'); 
    offCtx.fillStyle = grad; offCtx.fillRect(0, 0, w, h);
  }
  ctx.drawImage(offCanvas, x, y);
}

// ==========================================
// MAIN RENDERER
// ==========================================
function autoGenerateThumbnail() {
  const layout = document.getElementById('layoutSelect').value;
  const validImages = imgState.filter(s => s.img !== null);
  const count = validImages.length;

  const logoMaxHeight = 115; 
  let logoW = logoMaxHeight * (4/3); 
  if (channelLogo && channelLogo.width && channelLogo.height) {
    logoW = logoMaxHeight * (channelLogo.width / channelLogo.height);
  }

  const topTextRaw = document.getElementById('topText').value.split('\n');
  const top1 = topTextRaw[0] || ''; const top2 = topTextRaw[1] || ''; 
  const botTxt = document.getElementById('bottomText').value;

  const cTop1 = document.getElementById('cTop1').value;
  const cTop2 = document.getElementById('cTop2').value;
  const cBot = document.getElementById('cBot').value;


  // ====================================================
  // FIXED NEW STYLE: EXACT BREAKING NEWS LAYOUT MATCH
  // ====================================================
  if (layout === 'news-yellow') {
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
    
    // 1. Black Top Header (Increased height to 200px for Tamil Ascenders)
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, 200);

    // 2. Yellow Sub Header (Moved down: 200 to 420)
    ctx.fillStyle = '#fce300';
    ctx.fillRect(0, 200, W, 220);

    // 3. White Area for Grid (Moved down: 420 to 900)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 420, W, 480);

    // 4. Black Footer (900 to 1080)
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 900, W, 180);

    // Grid Images Drawing
    const gridY = 430; const gridH = 460;
    if (count === 1) {
      drawGridImage(validImages[0], 20, gridY, 1880, gridH);
    } else if (count === 2) {
      drawGridImage(validImages[0], 20, gridY, 930, gridH);
      drawGridImage(validImages[1], 970, gridY, 930, gridH);
    } else if (count >= 3) {
      drawGridImage(validImages[0], 20, gridY, 613, gridH);
      drawGridImage(validImages[1], 653, gridY, 613, gridH);
      drawGridImage(validImages[2], 1286, gridY, 613, gridH);
    }

    // --- PURE FLAT & BOLD TEXT (Y Coordinates shifted down) ---
    const topTextZoneWidth1 = W - 40; 
    const topCenterX1 = W / 2;
    const fs1 = getAutoFillFontSize(top1, topTextZoneWidth1, 160); 
    // Shifted Y from 90 to 110 to save the top curves of Tamil text (தி, லி)
    draw3DText(top1, topCenterX1, 110, fs1, cTop1, true);  

    const fs2 = getAutoFillFontSize(top2, 1820, 170); 
    // Shifted Y to align in the new Yellow box center
    draw3DText(top2, W/2, 320, fs2, cTop2, true);  

    const fsBot = getAutoFillFontSize(botTxt, 1820, 140);
    draw3DText(botTxt, W/2, 995, fsBot, cBot, true); 

  } 
  
  // ==========================================
  // FIXED STYLE: NEWS BRAND (BLUE)
  // ==========================================
  else if (layout === 'news-brand') {
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);

    // Grid Moved down to 400 for Tamil Text Breathing Room
    const gridY = 400; const gridH = 480;
    
    if (count === 1) {
      drawGridImage(validImages[0], 20, gridY, 1880, gridH);
    } else if (count === 2) {
      drawGridImage(validImages[0], 20, gridY, 930, gridH);
      drawGridImage(validImages[1], 970, gridY, 930, gridH);
    } else if (count >= 3) {
      drawGridImage(validImages[0], 20, gridY, 613, gridH);
      drawGridImage(validImages[1], 653, gridY, 613, gridH);
      drawGridImage(validImages[2], 1286, gridY, 613, gridH);
    }

    ctx.fillStyle = '#000836'; ctx.fillRect(0, 880, W, 200);
    ctx.fillStyle = '#001980'; ctx.fillRect(0, 880, W, 8);

    const topTextZoneWidth = W - 40; 
    const topCenterX = W / 2; 

    // Capped max font sizes to avoid vertical overlap
    const fs1 = getAutoFillFontSize(top1, topTextZoneWidth, 180); 
    const fs2 = getAutoFillFontSize(top2, topTextZoneWidth, 160); 
    const fsBot = getAutoFillFontSize(botTxt, 1820, 140);

    // Fixed absolute Y positions instead of dynamic centering
    let y1 = 130; let y2 = 290;
    if (!top2.trim()) { y1 = 200; } // Center if only 1 line

    let yBot = 990; 
    draw3DText(top1, topCenterX, y1, fs1, cTop1, false);  
    if (top2.trim()) draw3DText(top2, topCenterX, y2, fs2, cTop2, false);  
    draw3DText(botTxt, W/2, yBot, fsBot, cBot, false); 
  } 
  
  // ==========================================
  // FIXED STYLE: STANDARD
  // ==========================================
  else {
    ctx.fillStyle = '#0a1529'; ctx.fillRect(0, 0, W, H);
    
    // Shifted images slightly down (to Y=280) so top text doesn't overlap faces
    let imgY = 280, imgH = 650;
    if (count === 1) drawSeamlessImageStandard(validImages[0], 0, imgY, W, imgH, false);
    else if (count === 2) { drawSeamlessImageStandard(validImages[0], 0, imgY, 1080, imgH, false); drawSeamlessImageStandard(validImages[1], W - 1080, imgY, 1080, imgH, true); } 
    else if (count >= 3) { drawSeamlessImageStandard(validImages[0], 0, imgY, 800, imgH, false); drawSeamlessImageStandard(validImages[1], 560, imgY, 800, imgH, true); drawSeamlessImageStandard(validImages[2], 1120, imgY, 800, imgH, true); }

    const gradType = document.getElementById('gradientSelect').value;
    let cSolid, cSemi, cTrans;
    if (gradType === 'navy') { cSolid = '#051024'; cSemi = 'rgba(5, 16, 36, 0.85)'; cTrans = 'rgba(5, 16, 36, 0)'; } 
    else if (gradType === 'red') { cSolid = '#330000'; cSemi = 'rgba(51, 0, 0, 0.85)'; cTrans = 'rgba(51, 0, 0, 0)'; } 
    else { cSolid = '#000000'; cSemi = 'rgba(0, 0, 0, 0.85)'; cTrans = 'rgba(0, 0, 0, 0)'; }

    const topGrad = ctx.createLinearGradient(0, 0, 0, 420);
    topGrad.addColorStop(0, cSolid); topGrad.addColorStop(0.5, cSemi); topGrad.addColorStop(1, cTrans);
    ctx.fillStyle = topGrad; ctx.fillRect(0, 0, W, 420);

    const botGrad = ctx.createLinearGradient(0, 750, 0, 1080);
    botGrad.addColorStop(0, cTrans); botGrad.addColorStop(0.4, cSemi); botGrad.addColorStop(1, cSolid);
    ctx.fillStyle = botGrad; ctx.fillRect(0, 750, W, 330);

    const topTextZoneWidth = W - 40; 
    const topCenterX = W / 2; 

    // Capped Max Font Sizes
    const fs1 = getAutoFillFontSize(top1, topTextZoneWidth, 190); 
    const fs2 = getAutoFillFontSize(top2, topTextZoneWidth, 170); 
    const fsBot = getAutoFillFontSize(botTxt, 1820, 140);
    
    // Fixed absolute Y positions
    let y1 = 100; let y2 = 240;
    if (!top2.trim()) { y1 = 160; } // Center if only 1 line
    
    let yBot = 1000;
    draw3DText(top1, topCenterX, y1, fs1, cTop1, false); 
    if (top2.trim()) draw3DText(top2, topCenterX, y2, fs2, cTop2, false); 
    draw3DText(botTxt, W/2, yBot, fsBot, cBot, false); 
  }

  // --- LOGO DRAWING (Fixed Quality, Size & Position) ---
  let logoY = 20; 
  if (layout === 'news-yellow') {
    logoY = 421; // Yellow border முடிந்து 1px இடைவெளி (420 + 1)
  } else if (layout === 'news-brand') {
    logoY = 401; // Grid Image தொடங்கும் இடத்தில் 1px இடைவெளி (400 + 1)
  } else {
    logoY = 281; // Standard - Grid Image தொடங்கும் இடத்தில் 1px இடைவெளி (280 + 1)
  }

  const logoX = W - logoW - 1; // வலது ஓரத்தில் சரியாக 1px இடைவெளி

  if (channelLogo) {
    ctx.drawImage(channelLogo, logoX, logoY, logoW, logoMaxHeight);
  } else {
    const superSampledW = logoW * 4; // High Quality Supersampling
    const crickCanvas = getCrickNewsLogoCanvas(superSampledW);
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(crickCanvas, 0, 0, crickCanvas.width, crickCanvas.height, logoX, logoY, logoW, logoMaxHeight);
    ctx.restore();
  }

  // --- OVERLAYS DRAWING (WITH CROP & HANDLES) ---
  overlays.forEach((ov, i) => {
    if (!ov.img || isNaN(ov.scale) || ov.scale <= 0) return;

    const w = ov.cropW * ov.scale;
    const h = ov.cropH * ov.scale;

    ctx.save();
    ctx.translate(ov.cx, ov.cy);
    ctx.rotate(ov.rotation || 0);
    if (ov.flipX) ctx.scale(-1, 1);
    ctx.drawImage(ov.img, ov.cropX, ov.cropY, ov.cropW, ov.cropH, -w/2, -h/2, w, h);
    ctx.restore();

    if (i === activeOverlayIdx) {
      ctx.save(); 
      ctx.translate(ov.cx, ov.cy); 
      ctx.rotate(ov.rotation || 0);
      
      // Bounding Box
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 4; ctx.setLineDash([12, 12]);
      ctx.strokeRect(-w/2, -h/2, w, h); ctx.setLineDash([]);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      const drawCircleBtn = (x, y, icon, color, textColor) => {
          ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI*2);
          ctx.fillStyle = color; ctx.fill(); ctx.stroke();
          ctx.fillStyle = textColor; ctx.font = 'bold 24px Arial'; ctx.fillText(icon, x, y);
      };

      // Control Buttons (Rotate, Delete, Flip, Scale)
      ctx.beginPath(); ctx.moveTo(0, -h/2); ctx.lineTo(0, -h/2 - 60); ctx.stroke();
      drawCircleBtn(0, -h/2 - 60, '↻', '#fff', '#000'); 
      drawCircleBtn(w/2 + 20, -h/2 - 20, 'X', '#ff4d4d', '#fff'); 
      drawCircleBtn(-w/2 - 20, -h/2 - 20, '↔', '#1e3f7a', '#fff'); 
      drawCircleBtn(w/2 + 20, h/2 + 20, '⤡', '#ffd400', '#000'); 

      // Crop Handles (Left, Right, Top, Bottom Edges)
      const drawCropHandle = (x, y, cw, ch) => {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.strokeStyle = '#007aff'; ctx.lineWidth = 4;
          ctx.fillRect(x - cw/2, y - ch/2, cw, ch);
          ctx.strokeRect(x - cw/2, y - ch/2, cw, ch);
      };
      
      drawCropHandle(-w/2, 0, 14, 40); 
      drawCropHandle(w/2, 0, 14, 40);  
      drawCropHandle(0, -h/2, 40, 14); 
      drawCropHandle(0, h/2, 40, 14);  

      ctx.restore();
    }
  });
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  activeOverlayIdx = -1; autoGenerateThumbnail();
  setTimeout(() => {
    const link = document.createElement('a');
    link.download = `Brand-Thumbnail-${new Date().getTime()}.webp`;
    link.href = canvas.toDataURL('image/webp', 0.9);
    link.click();
  }, 100);
});

document.fonts.ready.then(async () => {
  autoGenerateThumbnail();
});
</script>
