<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

<style>
  :root {
    --bg-color: #0b1424; --surface-color: #101c33;
    --primary-color: #ffd400; --text-primary: #eef2f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-color); color: var(--text-primary);
    display: flex; flex-direction: column; 
    height: 100dvh; 
    overflow: hidden; 
    overscroll-behavior-y: none;

  .app-bar {
    background: var(--surface-color); padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); z-index: 50; position: relative;
  }
  .app-bar h1 { font-size: 15px; margin: 0; color: var(--primary-color); text-transform: uppercase; letter-spacing: 1px;}
  .settings-btn {
    font-size: 18px; cursor: pointer; background: #1e2f4e; padding: 4px 10px; 
    border-radius: 6px; border: 1px solid #263c63;
  }
  .settings-btn:active { transform: scale(0.95); }

  .settings-menu {
    position: absolute; top: 55px; right: 16px; background: #0b1730;
    border: 1px solid #2a5298; border-radius: 10px; padding: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 100;
    display: none; width: 280px; max-height: 75vh; overflow-y: auto;
  }
  .settings-menu h3 { margin: 0 0 10px 0; font-size: 12px; color: #7fb3ff; text-transform: uppercase;}

  .styled-select {
    width: 100%; padding: 8px; border-radius: 6px; background: #050a14;
    color: #fff; border: 1px solid #263c63; font-size: 12px; font-weight: bold;
    outline: none; margin-bottom: 12px; cursor: pointer;
  }
  
  .font-upload-btn {
    background: #1e3f7a; color: #fff; padding: 8px; border-radius: 6px; 
    text-align: center; font-size: 11px; cursor: pointer; display: block; border: 1px dashed #7fb3ff;
  }
  .font-upload-btn input { display: none; }
  .font-status { font-size: 10px; color: #00e676; margin-top: 6px; text-align: center; }

  .preview-area {
    width: 100vw; height: 56.25vw; background: #000;
    flex-shrink: 0; border-bottom: 2px solid #1e2f4e; position: relative;
    touch-action: none; cursor: grab; z-index: 10;
  }
  .preview-area:active { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  .controls-area { 
    flex: 1; padding: 12px; z-index: 1; 
    display: flex; flex-direction: column; gap: 10px;
    overflow: hidden; 
    /* Increased padding-bottom so the UI button can scroll slightly higher up */
    padding-bottom: 95px; 
  }
  
  .compact-card {
    background: var(--surface-color); border: 1px solid #1e2f4e;
    border-radius: 10px; padding: 12px; 
    display: flex; flex-direction: column; gap: 12px;
  }

  .multi-upload-btn {
    display: block; background: #1e3f7a; color: #fff; padding: 8px 12px; 
    border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold;
    cursor: pointer; border: 1px dashed #7fb3ff;
  }
  .multi-upload-btn input { display: none; }

  .field-row { display: flex; gap: 8px; align-items: center; }
  .color-col { display: flex; flex-direction: column; gap: 6px; justify-content: space-between; }
  
  .field-row input[type="color"] {
    width: 35px; height: 32px; border: none; border-radius: 6px; cursor: pointer;
    background: #0b1730; padding: 1px; flex-shrink: 0;
  }
  .field-row input[type="text"] {
    flex: 1; background: #0b1730; border: 1px solid #263c63;
    border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13px; font-weight: bold; height: 38px;
  }
  .field-row input[type="text"]:focus, .field-row textarea:focus { 
    outline: none; border-color: var(--primary-color); 
  }
  .field-row textarea {
    flex: 1; background: #0b1730; border: 1px solid #263c63;
    border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13px; font-weight: bold;
    height: 60px; resize: none; font-family: inherit; line-height: 1.4;
  }

  .action-btn-row { display: flex; gap: 8px; margin-top: 15px; }
  .action-btn {
    flex: 1; padding: 10px; border-radius: 6px; text-align: center; color: #fff;
    font-size: 12px; font-weight: bold; cursor: pointer; border: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);

  .action-btn:active { transform: scale(0.97); }

  .fab {

    font-size: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    text-transform: uppercase; cursor: pointer; z-index: 20;

  .fab:active { transform: scale(0.98); }

<body>

<div class="app-bar">
  <h1>⚡ YouTube Thumbnail Maker</h1>

  <div class="settings-menu" id="settingsMenu">

    <select id="textStyleSelect" class="styled-select">

      <option value="1">🔥 1. Smooth Warm 3D (Orange Base)</option>
      <option value="2">❄️ 2. Smooth Cool 3D (Blue Base)</option>
      <option value="3">🔮 3. Smooth Candy 3D (Purple Base)</option>
      <option value="4">⭐ 4. Premium Deep-Red 3D</option>

</div>

<div class="preview-area" id="previewArea">
  <canvas id="canvas" width="1920" height="1080"></canvas>
</div>

<div class="controls-area">
  <div class="compact-card">
    <label class="multi-upload-btn">
      🖼️ படங்களை செலக்ட் செய்யவும்
      <input type="file" id="multiImageUpload" accept="image/*" multiple>
    </label>
    
    <div class="field-row" style="align-items: stretch;">
      <div class="color-col">
        <input type="color" id="cTop1" value="#ffff00" title="Top Row Color">
        <input type="color" id="cTop2" value="#ffffff" title="Second Row Color">
      </div>
      <textarea id="topText" placeholder="முதல் & இரண்டாம் வரி... (Enter தட்டவும்)"></textarea>
    </div>

    <div class="field-row">
      <input type="color" id="cBot" value="#00ff00" title="Bottom Row Color">
      <input type="text" id="bottomText" value="" placeholder="கீழ் வரி...">
    </div>

    <div class="action-btn-row">
      <label class="action-btn" id="addImageLabel" style="background: #1e3f7a; border: 1px dashed #7fb3ff;">
        <input type="file" id="addImageUpload" accept="image/*" multiple style="display:none;">
        🖼️ Add Image
      </label>
      <button class="action-btn" id="cutoutBtn" style="background: #20407a; border: 1px dashed #7fb3ff;">
        ✂️ Cutout (BG Remove)
      </button>
      <input type="file" id="overlayImageUpload" accept="image/*" style="display:none;">
    </div>
    
    <!-- UI-ல் பட்டன் சற்று மேலே வர margin-top குறைக்கப்பட்டுள்ளது -->
    <div class="action-btn-row" style="margin-top: 6px;">
      <button class="action-btn" id="addArrowBtn" style="background: #8b0000; border: 1px dashed #ff4d4d;">
        ↗️ Add Arrow Mark
      </button>
    </div>

  </div>
</div>

<button class="fab" id="downloadBtn">Download HD Thumbnail</button>

<script>
const W = 1920, H = 1080;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let activeFontFamily = '"Anek Tamil", sans-serif'; 

document.getElementById('settingsBtn').addEventListener('click', () => {
  const menu = document.getElementById('settingsMenu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
});

document.getElementById('textStyleSelect').addEventListener('change', autoGenerateThumbnail);
document.getElementById('gradientSelect').addEventListener('change', autoGenerateThumbnail);

['topText', 'bottomText', 'cTop1', 'cTop2', 'cBot'].forEach(id => {
  document.getElementById(id).addEventListener('input', autoGenerateThumbnail);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#settingsMenu') && !e.target.closest('#settingsBtn')) {
    document.getElementById('settingsMenu').style.display = 'none';
  }
});

// INDEXED DB & FONT LOGIC
const DB_NAME = 'FontDatabase';
const STORE_NAME = 'userFonts';
let db;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    request.onsuccess = (e) => { db = e.target.result; resolve(); };
    request.onerror = (e) => reject(e.target.error);
  });
}

async function loadSavedFont() {
  const tx = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  const request = store.getAllKeys();
  request.onsuccess = async () => {
    const keys = request.result;
    if (keys.length > 0) {
      const lastFontName = keys[keys.length - 1];
      const getReq = store.get(lastFontName);
      getReq.onsuccess = async () => { await applyFont(lastFontName, getReq.result); };
    }
  };
}

async function applyFont(fontName, arrayBuffer) {
  try {
    const cleanName = fontName.split('.')[0]; 
    const font = new FontFace(cleanName, arrayBuffer);
    await font.load();
    document.fonts.add(font);
    activeFontFamily = `"${cleanName}"`;
    document.getElementById('fontStatus').innerText = `Current: ${cleanName} (Saved)`;
    autoGenerateThumbnail();
  } catch (err) {}
}

document.getElementById('fontUpload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const arrayBuffer = await file.arrayBuffer();
  const tx = db.transaction(STORE_NAME, 'readwrite');
  tx.objectStore(STORE_NAME).put(arrayBuffer, file.name);
  tx.oncomplete = () => { applyFont(file.name, arrayBuffer); };
  document.getElementById('settingsMenu').style.display = 'none';
});

// BACKGROUND IMAGES
const imgState = [ { img: null, ox: 0, oy: 0 }, { img: null, ox: 0, oy: 0 }, { img: null, ox: 0, oy: 0 } ];

document.getElementById('multiImageUpload').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files).slice(0, 3); 
  if (files.length === 0) return;
  imgState.forEach(s => { s.img = null; s.ox = 0; s.oy = 0; });

  const loadImg = (file, index) => {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => { imgState[index].img = image; resolve(); };
      image.src = url;
    });
  };
  await Promise.all(files.map((f, i) => loadImg(f, i)));
  autoGenerateThumbnail();
});

// ==========================================
// OVERLAYS (BG REMOVE & 360 ARROWS)
// ==========================================
const overlays = []; 
let activeOverlayIdx = -1; 
let draggingOverlayIdx = -1;
let rotatingOverlayIdx = -1;

// Better 3D Arrow Graphic
let arrowImage = null;
function generateArrowGraphic() {
  const c = document.createElement('canvas');
  c.width = 400; c.height = 400;
  const cx = c.getContext('2d');
  cx.shadowColor = 'rgba(0,0,0,0.8)'; cx.shadowBlur = 15; cx.shadowOffsetY = 10;
  cx.fillStyle = '#ff0000'; cx.strokeStyle = '#ffffff'; cx.lineWidth = 12; cx.lineJoin = 'round';
  cx.translate(200, 200); cx.rotate(-35 * Math.PI/180); cx.translate(-200, -200);
  
  cx.beginPath();
  cx.moveTo(160, 320); cx.lineTo(240, 320); cx.lineTo(240, 160); 
  cx.lineTo(320, 160); cx.lineTo(200, 40); cx.lineTo(80, 160); cx.lineTo(160, 160); 
  cx.closePath();
  cx.fill(); cx.stroke();
  arrowImage = new Image();
  arrowImage.src = c.toDataURL('image/png');
}
generateArrowGraphic();

document.getElementById('addArrowBtn').addEventListener('click', () => {
  if (arrowImage) {
    // Arrow Canvas-ல் சற்று மேலே தோன்றுவதற்காக Y-Position குறைக்கப்பட்டுள்ளது (H/2 - 280)
    overlays.push({ img: arrowImage, x: W/2 - 150, y: H/2 - 280, w: 300, h: 300, flipX: false, rotation: 0 });
    activeOverlayIdx = overlays.length - 1; 
    autoGenerateThumbnail();
  }
});

function loadOverlayToCanvas(url, staggerIndex, sourceFile) {
  staggerIndex = staggerIndex || 0;
  const img = new Image();
  img.onload = () => {
    let maxH = 650;
    let newH = Math.min(img.height, maxH);
    let newW = newH * (img.width / img.height);
    const stagger = staggerIndex * 70;
    overlays.push({ img: img, x: W/2 - newW/2 + stagger, y: H/2 - newH/2 + stagger, w: newW, h: newH, flipX: false, rotation: 0, sourceFile: sourceFile || null });
    activeOverlayIdx = overlays.length - 1; 
    autoGenerateThumbnail();
  };
  img.src = url;
}

document.getElementById('addImageUpload').addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach((file, idx) => {
    const url = URL.createObjectURL(file);
    loadOverlayToCanvas(url, idx, file);
  });
  e.target.value = ''; 
});

// ==========================================
// CUTOUT (BG REMOVE) WITH MEDIAPIPE SELFIE SEGMENTATION
// ==========================================
async function runCutout(file, targetOverlayIdx) {
  const btn = document.getElementById('cutoutBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ Processing... (Wait)';
  btn.style.pointerEvents = 'none';

  const applyResult = (url) => {
    const img = new Image();
    img.onload = () => {
      if (targetOverlayIdx !== null && overlays[targetOverlayIdx]) {
        overlays[targetOverlayIdx].img = img;
        activeOverlayIdx = targetOverlayIdx;
        autoGenerateThumbnail();
      } else {
        loadOverlayToCanvas(url, 0, file);
      }
    };
    img.src = url;
  };

  try {
    if (!window.SelfieSegmentation) {
      throw new Error('MediaPipe Selfie Segmentation Library is not loaded.');
    }

    if (!window.mpSelfieSegmentation) {
      window.mpSelfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });
      window.mpSelfieSegmentation.setOptions({
        modelSelection: 0,
      });
    }

    const objectUrl = URL.createObjectURL(file);
    const imgElement = new Image();
    imgElement.crossOrigin = "anonymous";
    
    await new Promise((resolve, reject) => {
      imgElement.onload = resolve;
      imgElement.onerror = reject;
      imgElement.src = objectUrl;
    });

    const maskPromise = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("Processing timeout")), 25000);
      
      window.mpSelfieSegmentation.onResults((results) => {
        clearTimeout(timer);
        
        const outCanvas = document.createElement('canvas');
        outCanvas.width = imgElement.naturalWidth || imgElement.width;
        outCanvas.height = imgElement.naturalHeight || imgElement.height;
        const outCtx = outCanvas.getContext('2d');

        outCtx.clearRect(0, 0, outCanvas.width, outCanvas.height);
        outCtx.drawImage(results.segmentationMask, 0, 0, outCanvas.width, outCanvas.height);
        
        outCtx.globalCompositeOperation = 'source-in';
        outCtx.drawImage(results.image, 0, 0, outCanvas.width, outCanvas.height);

        resolve(outCanvas.toDataURL('image/png'));
      });
    });

    await window.mpSelfieSegmentation.send({ image: imgElement });
    const finalUrl = await maskPromise;
    applyResult(finalUrl);

  } catch(err) {
    console.warn("Background removal error:", err);
    try {
      applyResult(URL.createObjectURL(file));
      alert("Background Remove failed. Adding normal image instead.\n\nError: " + err.message);
    } catch(err2) {
      console.error("Fallback image add also failed:", err2);
      alert("படத்தை சேர்க்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.");
    }
  } finally {
    btn.innerHTML = originalText;
    btn.style.pointerEvents = 'auto';
  }
}

document.getElementById('cutoutBtn').addEventListener('click', () => {
  const activeOv = overlays[activeOverlayIdx];
  if (activeOv && activeOv.sourceFile) {
    runCutout(activeOv.sourceFile, activeOverlayIdx);
  } else if (activeOv && !activeOv.sourceFile) {
    alert('இந்த ஐட்டத்தை Cutout செய்ய முடியாது. Preview-ல் ஒரு படத்தை தேர்ந்தெடுக்கவும் அல்லது புதிய படத்தை சேர்க்கவும்.');
  } else {
    document.getElementById('overlayImageUpload').click();
  }
});

document.getElementById('overlayImageUpload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = ''; 
  if (!file) return;
  runCutout(file, null);
});


// DRAGGING & ROTATION LOGIC 
let startX = 0, startY = 0;
let draggingBgIdx = -1;

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - rect.left) * (W / rect.width), y: (cy - rect.top) * (H / rect.height) };
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = getCanvasPos(e);
  startX = pos.x; startY = pos.y;
  
  if (activeOverlayIdx !== -1) {
    const ov = overlays[activeOverlayIdx];
    const cx = ov.x + ov.w/2; const cy = ov.y + ov.h/2;
    
    const rot = -(ov.rotation || 0);
    const dx = pos.x - cx; const dy = pos.y - cy;
    const locX = dx * Math.cos(rot) - dy * Math.sin(rot);
    const locY = dx * Math.sin(rot) + dy * Math.cos(rot);

    if (Math.hypot(locX - 0, locY - (-ov.h/2 - 60)) <= 50) {
      rotatingOverlayIdx = activeOverlayIdx;
      return;
    }
    if (Math.hypot(locX - ov.w/2, locY - (-ov.h/2)) <= 50) {
      overlays.splice(activeOverlayIdx, 1);
      activeOverlayIdx = -1;
      autoGenerateThumbnail();
      return;
    }
    if (Math.hypot(locX - (-ov.w/2), locY - (-ov.h/2)) <= 50) {
      ov.flipX = !ov.flipX;
      autoGenerateThumbnail();
      return;
    }
  }

  for(let i = overlays.length - 1; i >= 0; i--) {
    const ov = overlays[i];
    const cx = ov.x + ov.w/2; const cy = ov.y + ov.h/2;
    const dx = pos.x - cx; const dy = pos.y - cy;
    const rot = -(ov.rotation || 0);
    const locX = dx * Math.cos(rot) - dy * Math.sin(rot);
    const locY = dx * Math.sin(rot) + dy * Math.cos(rot);
    
    if (Math.abs(locX) <= ov.w/2 && Math.abs(locY) <= ov.h/2) {
      activeOverlayIdx = i;
      draggingOverlayIdx = i;
      autoGenerateThumbnail(); 
      return;
    }
  }

  activeOverlayIdx = -1;
  autoGenerateThumbnail();

  const count = imgState.filter(s => s.img).length;
  if (pos.y > 200 && pos.y < 950) {
    if (count === 1) draggingBgIdx = 0;
    else if (count === 2) draggingBgIdx = (pos.x < W / 2) ? 0 : 1;
    else if (count >= 3) {
      if (pos.x < 640) draggingBgIdx = 0;
      else if (pos.x < 1280) draggingBgIdx = 1;
      else draggingBgIdx = 2;
    }
  }
});

window.addEventListener('pointermove', (e) => {
  const pos = getCanvasPos(e);
  if (rotatingOverlayIdx !== -1) {
    e.preventDefault();
    const ov = overlays[rotatingOverlayIdx];
    const cx = ov.x + ov.w/2; const cy = ov.y + ov.h/2;
    ov.rotation = Math.atan2(pos.y - cy, pos.x - cx) + Math.PI/2;
    autoGenerateThumbnail();
  } 
  else if (draggingOverlayIdx !== -1) {
    e.preventDefault(); 
    overlays[draggingOverlayIdx].x += pos.x - startX; 
    overlays[draggingOverlayIdx].y += pos.y - startY;
    startX = pos.x; startY = pos.y;
    autoGenerateThumbnail();
  } 
  else if (draggingBgIdx !== -1) {
    e.preventDefault(); 
    imgState[draggingBgIdx].ox += pos.x - startX; 
    imgState[draggingBgIdx].oy += pos.y - startY;
    startX = pos.x; startY = pos.y;
    requestAnimationFrame(autoGenerateThumbnail);
  }
});

window.addEventListener('pointerup', () => {
  draggingOverlayIdx = -1;
  rotatingOverlayIdx = -1;
  draggingBgIdx = -1;
});

// ==========================================
// AUTO TEXT SIZING ENGINE
// ==========================================
function getFittedFontSize(text, maxW, baseSize) {
  let fontSize = baseSize;
  ctx.font = `900 ${fontSize}px ${activeFontFamily}, Arial, sans-serif`;
  while(ctx.measureText(text).width > maxW && fontSize > 40) {
    fontSize -= 5;
    ctx.font = `900 ${fontSize}px ${activeFontFamily}, Arial, sans-serif`;
  }
  return fontSize;
}

function draw3DText(text, x, y, fontSize, color) {
  if (!text || !text.trim()) return;

  ctx.font = `900 ${fontSize}px ${activeFontFamily}, Arial, sans-serif`;
  const styleId = document.getElementById('textStyleSelect').value;
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;

  const drawSuperBoldText = () => {
    ctx.lineWidth = 3; 
    ctx.strokeStyle = color; 
    ctx.strokeText(text, x, y); 
    ctx.fillStyle = color; 
    ctx.fillText(text, x, y);
  };

  if (styleId === "9") {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,1)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 8;
    ctx.lineWidth = 28; 
    ctx.strokeStyle = '#000000'; 
    ctx.strokeText(text, x, y);
    ctx.restore();
    
    ctx.lineWidth = 10; 
    ctx.strokeStyle = '#ffffff'; 
    ctx.strokeText(text, x, y);
    drawSuperBoldText();
  } else if (styleId === "10") {
    ctx.save();
    ctx.lineWidth = 26; 
    ctx.strokeStyle = '#000000';
    ctx.strokeText(text, x + 8, y + 8);
    ctx.fillStyle = '#000000'; 
    ctx.fillText(text, x + 8, y + 8);
    ctx.strokeText(text, x, y);
    ctx.restore();
    ctx.lineWidth = 8; 
    ctx.strokeStyle = '#ffffff'; 
    ctx.strokeText(text, x, y);
    drawSuperBoldText();
  } else if (styleId === "6") {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 12; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 8;
    ctx.lineWidth = 22; 
    ctx.strokeStyle = '#000'; 
    ctx.strokeText(text, x, y); 
    ctx.restore(); 
    ctx.lineWidth = 6; 
    ctx.strokeStyle = '#fff'; 
    ctx.strokeText(text, x, y); 
    drawSuperBoldText();
  } else if (styleId === "1") {
    const depth = 5; const thick = 7; 
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 6;
    ctx.lineWidth = thick; ctx.strokeStyle = '#cc5500'; ctx.strokeText(text, x + depth, y + depth); ctx.restore();
    for (let i = depth; i >= 1; i--) { ctx.lineWidth = thick; ctx.strokeStyle = '#ff8800'; ctx.strokeText(text, x + i, y + i); ctx.fillStyle = '#ff8800'; ctx.fillText(text, x + i, y + i); }
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#e65c00'; ctx.strokeText(text, x, y); drawSuperBoldText();
  } else if (styleId === "2") {
    const depth = 5; const thick = 7;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 6;
    ctx.lineWidth = thick; ctx.strokeStyle = '#003380'; ctx.strokeText(text, x + depth, y + depth); ctx.restore();
    for (let i = depth; i >= 1; i--) { ctx.lineWidth = thick; ctx.strokeStyle = '#0066ff'; ctx.strokeText(text, x + i, y + i); ctx.fillStyle = '#0066ff'; ctx.fillText(text, x + i, y + i); }
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#0044cc'; ctx.strokeText(text, x, y); drawSuperBoldText();
  } else if (styleId === "3") {
    const depth = 5; const thick = 7;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 6;
    ctx.lineWidth = thick; ctx.strokeStyle = '#4d0099'; ctx.strokeText(text, x + depth, y + depth); ctx.restore();
    for (let i = depth; i >= 1; i--) { ctx.lineWidth = thick; ctx.strokeStyle = '#9933ff'; ctx.strokeText(text, x + i, y + i); ctx.fillStyle = '#9933ff'; ctx.fillText(text, x + i, y + i); }
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#7300e6'; ctx.strokeText(text, x, y); drawSuperBoldText();
  } else if (styleId === "4") {
    const depth = 5; const thick = 7;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 6;
    ctx.lineWidth = thick; ctx.strokeStyle = '#330000'; ctx.strokeText(text, x + depth, y + depth); ctx.restore();
    for (let i = depth; i >= 1; i--) { ctx.lineWidth = thick; ctx.strokeStyle = '#660000'; ctx.strokeText(text, x + i, y + i); ctx.fillStyle = '#cc2900'; ctx.fillText(text, x + i, y + i); }
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#4d0000'; ctx.strokeText(text, x, y); drawSuperBoldText();
  } else if (styleId === "5") {
    const depth = 6; const thick = 10;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 6;
    ctx.lineWidth = thick; ctx.strokeStyle = '#000'; ctx.strokeText(text, x + depth, y + depth); ctx.restore();
    for (let i = depth; i >= 1; i--) { ctx.lineWidth = thick; ctx.strokeStyle = '#000'; ctx.strokeText(text, x + i, y + i); ctx.fillStyle = '#000'; ctx.fillText(text, x + i, y + i); }
    ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(text, x, y); drawSuperBoldText();
  } else if (styleId === "7") {
    const depth = 4; const thick = 10;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 6;
    ctx.lineWidth = thick; ctx.strokeStyle = '#500000'; ctx.strokeText(text, x + depth, y + depth); ctx.restore();
    for (let i = depth; i >= 1; i--) { ctx.lineWidth = thick; ctx.strokeStyle = '#8b0000'; ctx.strokeText(text, x + i, y + i); ctx.fillStyle = '#8b0000'; ctx.fillText(text, x + i, y + i); }
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(text, x, y); drawSuperBoldText();
  } else if (styleId === "8") {
    ctx.lineWidth = 14; ctx.strokeStyle = '#000'; 
    ctx.strokeText(text, x + 6, y + 6); ctx.fillStyle = '#000'; ctx.fillText(text, x + 6, y + 6);
    ctx.strokeText(text, x, y); drawSuperBoldText();
  }
}

function drawSeamlessImage(state, x, y, w, h, fadeLeft) {
  if (!state.img) return;
  const offCanvas = document.createElement('canvas');
  offCanvas.width = w; offCanvas.height = h;
  const offCtx = offCanvas.getContext('2d');

  const scale = Math.max(w / state.img.width, h / state.img.height);
  const dw = state.img.width * scale; const dh = state.img.height * scale;
  const dx = ((w - dw) / 2) + state.ox; const dy = ((h - dh) / 2) + state.oy;

  offCtx.filter = 'contrast(1.15) saturate(1.25) brightness(1.05)';
  offCtx.drawImage(state.img, dx, dy, dw, dh);

  if (fadeLeft) {
    offCtx.globalCompositeOperation = 'destination-in';
    const grad = offCtx.createLinearGradient(0, 0, 240, 0); 
    grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,1)'); 
    offCtx.fillStyle = grad; offCtx.fillRect(0, 0, w, h);
  }
  ctx.drawImage(offCanvas, x, y);
}

function autoGenerateThumbnail() {
  ctx.fillStyle = '#0a1529'; 
  ctx.fillRect(0, 0, W, H);

  const validImages = imgState.filter(s => s.img !== null);
  const count = validImages.length;

  if (count === 1) {
    drawSeamlessImage(validImages[0], 0, 250, W, 680, false);
  } else if (count === 2) {
    drawSeamlessImage(validImages[0], 0, 250, 1080, 680, false);
    drawSeamlessImage(validImages[1], W - 1080, 250, 1080, 680, true);
  } else if (count >= 3) {
    drawSeamlessImage(validImages[0], 0, 250, 800, 680, false);         
    drawSeamlessImage(validImages[1], 560, 250, 800, 680, true);        
    drawSeamlessImage(validImages[2], 1120, 250, 800, 680, true);       
  }

  const gradType = document.getElementById('gradientSelect').value;
  let cSolid, cSemi, cTrans;

  if (gradType === 'navy') {
    cSolid = '#051024'; cSemi = 'rgba(5, 16, 36, 0.85)'; cTrans = 'rgba(5, 16, 36, 0)';
  } else if (gradType === 'red') {
    cSolid = '#330000'; cSemi = 'rgba(51, 0, 0, 0.85)'; cTrans = 'rgba(51, 0, 0, 0)';
  } else {
    cSolid = '#000000'; cSemi = 'rgba(0, 0, 0, 0.85)'; cTrans = 'rgba(0, 0, 0, 0)';
  }

  const topGrad = ctx.createLinearGradient(0, 0, 0, 420);
  topGrad.addColorStop(0, cSolid); 
  topGrad.addColorStop(0.5, cSemi); 
  topGrad.addColorStop(1, cTrans);
  ctx.fillStyle = topGrad; ctx.fillRect(0, 0, W, 420);

  const botGrad = ctx.createLinearGradient(0, 750, 0, 1080);
  botGrad.addColorStop(0, cTrans); 
  botGrad.addColorStop(0.4, cSemi); 
  botGrad.addColorStop(1, cSolid);
  ctx.fillStyle = botGrad; ctx.fillRect(0, 750, W, 330);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const topTextRaw = document.getElementById('topText').value.split('\n');
  const top1 = topTextRaw[0] || '';
  const top2 = topTextRaw[1] || ''; 
  const botTxt = document.getElementById('bottomText').value;

  const cTop1 = document.getElementById('cTop1').value;
  const cTop2 = document.getElementById('cTop2').value;
  const cBot = document.getElementById('cBot').value;

  const maxW = W - 60;
  const fs1 = getFittedFontSize(top1, maxW, 150);
  const fs2 = getFittedFontSize(top2, maxW, 135);
  const fsBot = getFittedFontSize(botTxt, maxW, 145);

  const topMargin = 50; 
  const lineGap = 35; 
  let y1 = topMargin + (fs1 / 2);
  let y2 = y1 + (fs1 / 2) + lineGap + (fs2 / 2);

  if (!top1.trim()) y2 = topMargin + (fs2 / 2);

  const bottomMargin = 15;
  let yBot = H - bottomMargin - (fsBot / 2);

  draw3DText(top1, W/2, y1, fs1, cTop1);  
  draw3DText(top2, W/2, y2, fs2, cTop2);  
  draw3DText(botTxt, W/2, yBot, fsBot, cBot); 

  overlays.forEach((ov, i) => {
    ctx.save();
    const cx = ov.x + ov.w/2;
    const cy = ov.y + ov.h/2;
    ctx.translate(cx, cy);
    ctx.rotate(ov.rotation || 0);
    if (ov.flipX) ctx.scale(-1, 1);
    ctx.drawImage(ov.img, -ov.w/2, -ov.h/2, ov.w, ov.h);
    ctx.restore();

    if (i === activeOverlayIdx) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ov.rotation || 0);
      
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 4; ctx.setLineDash([12, 12]);
      ctx.strokeRect(-ov.w/2, -ov.h/2, ov.w, ov.h);
      ctx.setLineDash([]);
      
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      ctx.beginPath(); ctx.moveTo(0, -ov.h/2); ctx.lineTo(0, -ov.h/2 - 60); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -ov.h/2 - 60, 28, 0, Math.PI*2);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000'; ctx.font = 'bold 34px Arial'; ctx.fillText('↻', 0, -ov.h/2 - 60);

      ctx.beginPath(); ctx.arc(ov.w/2, -ov.h/2, 28, 0, Math.PI*2);
      ctx.fillStyle = '#ff4d4d'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.fillText('X', ov.w/2, -ov.h/2);

      ctx.beginPath(); ctx.arc(-ov.w/2, -ov.h/2, 28, 0, Math.PI*2);
      ctx.fillStyle = '#1e3f7a'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 30px Arial'; ctx.fillText('↔', -ov.w/2, -ov.h/2);

      ctx.restore();
    }
  });
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  activeOverlayIdx = -1; 
  autoGenerateThumbnail();
  
  setTimeout(() => {
    const link = document.createElement('a');
    const timestamp = new Date().getTime(); 
    link.download = `YT-Thumbnail-${timestamp}.webp`;
    link.href = canvas.toDataURL('image/webp', 0.9);
    link.click();
  }, 100);
});

document.fonts.ready.then(async () => {
  try { await initDB(); await loadSavedFont(); } catch(e) {}
  autoGenerateThumbnail();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Active.'))
      .catch(err => console.error('Service Worker Error.', err));
  });
}
